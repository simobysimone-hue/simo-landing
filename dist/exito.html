<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101012">
  <title>SIMO · ¡Plaza confirmada!</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@400;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- Umami: estadísticas sin cookies (no necesita consentimiento) -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="961b1e2b-0403-421f-922b-cc89f5d497ac" data-domains="simoby.netlify.app"></script>
</head>
<body>
  <main class="result-page">
    <p class="eyebrow"><span class="stud" aria-hidden="true"></span> PAGO RECIBIDO</p>
    <h1 class="display">¡Plaza<br><em>confirmada!</em></h1>
    <p class="result-lead">Gracias por reservar. Te hemos enviado la confirmación con todos los detalles a tu email. Nos vemos en el taller · Casa de las Alajas, Madrid. Los viernes se entra por C/ Hileras 18 y los sábados por C/ San Martín 5.</p>
    <p class="result-note" id="detalle" hidden></p>
    <div class="hero-actions">
      <a class="btn btn-red" href="/">Volver al inicio</a>
      <a class="btn btn-ghost" href="https://www.instagram.com/simo.bysimone/" target="_blank" rel="noopener">Ver Instagram</a>
    </div>
  </main>
  <script src="consent.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('sesion');
    if (id) {
      fetch('/api/confirmar?id=' + encodeURIComponent(id)).then(r => r.json()).then(d => {
        if (d.fecha) {
          const el = document.getElementById('detalle');
          el.textContent = `Reserva: ${d.fecha} · ${d.personas} ${d.personas === 1 ? 'persona' : 'personas'}`;
          el.hidden = false;
        }
        // Compra para el píxel de Meta (solo se envía si la persona ha aceptado las cookies).
        // eventID = id de la sesión de Stripe: si recarga la página, Meta no la cuenta dos veces.
        if (d.estado === 'paid' && d.importe && window.umami) {
          window.umami.track('Compra', { modalidad: d.modalidad || 'taller', personas: d.personas, importe: d.importe });
        }
        if (d.estado === 'paid' && d.importe) {
          window.simoTrack('Purchase', {
            value: d.importe, currency: 'EUR', num_items: d.personas,
            content_name: d.modalidad === 'crea' ? 'Crea tu SIMO' : 'Customiza tu SIMO',
            content_ids: [d.modalidad || 'taller'], content_type: 'product'
          }, { eventID: id });
        }
      }).catch(() => {});
    }
  </script>
</body>
</html>
